apiVersion: apps/v1
kind: Deployment
metadata:
  name: productgateway-deployment
  namespace: nagp-ns
  labels:
    app: productgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productgateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: productgateway
    spec:
      containers:
        - name: productgateway
          image: CONTAINER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "700m"
          ports:
            - containerPort: 8060
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Xms512m -Xmx1536m -XX:+ExitOnOutOfMemoryError
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8061
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8061
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      serviceAccountName: product-sa